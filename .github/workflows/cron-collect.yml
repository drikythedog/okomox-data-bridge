name: Collect météo & trafic
# Exécute collect.py toutes les 30 minutes + commit/push data/data.json
# Publié automatiquement sur GitHub Pages (canonical URL).
# Si secrets FTP configurés, upload aussi vers LWS (okomox.site/data.json).

on:
  schedule:
    # GitHub Actions CRON UTC. Toutes les 30 minutes.
    # Note : la latence GitHub peut décaler de quelques minutes (best-effort).
    - cron: '*/30 * * * *'
  workflow_dispatch: {}  # permet déclenchement manuel via UI GitHub

# Permissions minimales : commit data/, déployer Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Évite les runs concurrents si un cron prend trop de temps.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run collect.py
        run: python collect.py

      - name: Show generated data.json (head)
        run: head -30 data/data.json

      - name: Commit & push data/data.json if changed
        run: |
          git config user.name "okomox-bot"
          git config user.email "bot@okomox.com"
          git add data/data.json
          if git diff --cached --quiet; then
            echo "Aucun changement de données, skip commit."
          else
            git commit -m "chore(data): MAJ auto $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      # =====================================================================
      # Upload FTP optionnel — actif uniquement si les secrets sont configurés
      # Settings → Secrets and variables → Actions → New secret :
      #   FTP_HOST   = ftp.okomox.com
      #   FTP_USER   = okomo2783657
      #   FTP_PASS   = (mot de passe FTP LWS)
      # =====================================================================
      - name: Upload FTP vers LWS (okomox.site/data.json)
        if: ${{ secrets.FTP_HOST != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./data/
          server-dir: /
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**

  deploy-pages:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (avec le commit qu'on vient de pousser)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (dossier data/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./data

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
